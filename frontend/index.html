<!DOCTYPE html>
<html>
    <head>
        <html lang="en"></html>
        <meta charset="UTF-8">
        <title>LeetCode Tracker</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>

    </head>
    <body>
        <ul id="problem-list">
            
        </ul>

        <dialog id="revision-dialog">
            <h3>Revise Problem</h3>

            <label for="revisit_date">Custom revisit date:</label>
            <input type="date"  id="revisit_date">

            <label for="remove_from_cycle">
                <input type="checkbox" id="remove_from_cycle">
                Remove from revisit cycle
            </label>

            <button id="confirm-revision">Confirm</button>
            <button id="cancel-revision">Cancel</button>
        </dialog>

        <div class="search">
            <label for="search_input">Search Problem</label>
            <input type="text" id="search_input" placeholder="add a problem name or number">

            <button id="search_btn" type="button">search</button>

            <div class="search_results">

            </div>
        </div>
    </body>
</html>
