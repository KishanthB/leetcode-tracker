<!DOCTYPE html>
<html>
    <head>
        <html lang="en"></html>
        <meta charset="UTF-8">
        <title>LeetCode Tracker</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>

    </head>
    <body>
        <ul id="problem-list">
            
        </ul>

        <dialog id="revision-dialog">
            <h3>Revise Problem</h3>

            <label for="revisit_date">Custom revisit date:</label>
            <input type="date"  id="revisit_date">

            <label for="remove_from_cycle">
                <input type="checkbox" id="remove_from_cycle">
                Remove from revisit cycle
            </label>

            <button id="confirm-revision">Confirm</button>
            <button id="cancel-revision">Cancel</button>
        </dialog>

        <div class="search">
            <label for="search_input">Search Problem</label>
            <input type="text" id="search_input" placeholder="add a problem name or number">

            <button id="search_btn" type="button">search</button>

            <div class="search_results">

            </div>
        </div>

        <dialog class="search-problem-dialog">
            <p id="search-problem-no">Problem No: <span></span></p>
            <p id="search-problem-name">Problem Name: <span></span></p>
            <p id="search-problem-difficulty">Problem Difficulty: <span></span></p>
            <p id="search-problem-url">Problem URL: <span><a target="_blank">Open problem on LeetCode</a></span></p>
            <p id="search-revisit-count">Revisit Counts: <span></span></p>

            <label for="search-revisit-date">Revisit date: </label>
            <input type="date" id="search-revisit-date">
            <p id="search-revisit-message"></p>

            <label for="search-remove-from-cycle">
                <input type="checkbox" id="search-remove-from-cycle">
                Remove From Cycle
            </label>
            <p id="remove-from-cycle-message"></p>

            <div class="confirm-or-cancel">
                <button id="search-confirm">Confirm</button>
                <button id="search-cancel">Cancel</button>
            </div>
        </dialog>

        <div class="add-new-problem">
            <label for="add-btn">Add New Problem: </label>
            <button id="add-btn">Add New +</button>
        </div>

        <dialog class="add-problem-dialog">

            <label for="new-problem-no">Problem No: </label>
            <input type="number" id="new-problem-no" required>

            <label for="new-problem-name">Problem Name: </label>
            <input type="text" id="new-problem-name" required>

            <label for="new-problem-difficulty">Problem Difficulty: </label>
            <select id="new-problem-difficulty">
                <option>Easy</option>
                <option selected>Medium</option>
                <option>Hard</option>
            </select>

            <label for="new-problem-status">Problem Status: </label>
            <select id="new-problem-status">
                <option selected>Solved</option>
                <option>Unsolved</option>
                <option>Attempted</option>
            </select>

            <label for="new-problem-url">Problem URL: </label>
            <input type="text" id="new-problem-url">

            <label for="new-problem-revisit-date"></label>
            <input type="date" id="new-problem-revisit-date">
        </dialog>
    </body>
</html>
